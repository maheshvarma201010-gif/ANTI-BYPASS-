<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checking your browser...</title>
    <style>
        body {
            font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Fira Sans", "Droid Sans", "Helvetica Neue", Arial, sans-serif;
            background-color: #f7f9fc;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            text-align: center;
            background: white;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            max-width: 400px;
            width: 100%;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #3498db;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 2s linear infinite;
            margin: 0 auto 1rem;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h1 { font-size: 1.5rem; color: #333; }
        p { color: #666; }
        #error-message { color: #e74c3c; display: none; margin-top: 1rem; }
    </style>
</head>
<body>
    <div class="container" id="challenge-container">
        <div class="spinner"></div>
        <h1>Verifying...</h1>
        <p>Please wait while we check your connection.</p>
        <div id="error-message"></div>
    </div>

    <script src="/static/challenge.js"></script>
    <script>
        window.addEventListener('load', () => {
            if (typeof runChallenge === 'function') {
                setTimeout(() => {
                    runChallenge("{{ short_id }}", "{{ challenge_token }}");
                }, 2000);
            } else {
                document.getElementById('error-message').textContent = 'Error loading verification script.';
                document.getElementById('error-message').style.display = 'block';
            }
        });
    </script>
</body>
</html>
