<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>⚠️ Bypass Detected</title>
    <style>
        body {
            font-family: -apple-system, system-ui, BlinkMacSystemFont, "Segoe UI", Roboto, Oxygen, Ubuntu, Cantarell, "Fira Sans", "Droid Sans", "Helvetica Neue", Arial, sans-serif;
            background-color: #f7f9fc;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            user-select: none;
        }
        .container {
            text-align: center;
            background: white;
            padding: 3rem;
            border-radius: 12px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
            max-width: 550px;
            width: 100%;
        }
        h1 { font-size: 2rem; color: #e74c3c; margin-bottom: 1.5rem; }
        p { color: #444; line-height: 1.6; font-size: 1.1rem; }
    </style>
</head>
<body>
    <div class="container">
        <h1>⚠️ Bypass Detected</h1>
        <p>
            Access has been denied because the required referrer verification failed. This request appears to have bypassed the intended shortener flow.
        </p>
    </div>
    <script>
        // Prevent common interactions to make it feel like a "dead" page
        window.onbeforeunload = null;
        document.onkeydown = function (e) {
            return false;
        }
    </script>
</body>
</html>
